name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffmpeg обязателен: без него падают тесты пайплайна загрузки
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # mise поднимает bun той же версии, что закреплена в mise.toml
      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      # shellcheck ловит опечатки в скриптах установки: они выполняются
      # один раз на новой машине, и ошибка там означает сломанную установку
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Проверить, что шаблоны юнитов содержат плейсхолдеры
        run: |
          # install.sh подставляет их перед копированием в ~/.config. Если
          # плейсхолдер потеряется, юнит запустится с путём "__MUSICLIB_DIR__".
          for f in systemd/*.service.in; do
            grep -q '__MUSICLIB_DIR__' "$f" || { echo "нет плейсхолдера в $f"; exit 1; }
            grep -q '__BUN_BIN__' "$f" || { echo "нет __BUN_BIN__ в $f"; exit 1; }
          done

      # Прод-сборка в один файл: ломается тихо и опасно (бинарник может
      # не стартовать), а ловят это обычно уже на чужой машине. build.sh сам
      # проверяет результат запуском, поэтому достаточно дождаться его кода 0.
      - name: Собрать бинарник
        run: scripts/build.sh